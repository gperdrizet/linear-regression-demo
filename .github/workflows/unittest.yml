# This workflow will install Python dependencies and run tests when
# pull request is created to bring changes into main. Note: with a branch
# protection rule active, this test must pass for the merge to be possible

name: Unittest

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test with Python 3.11

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -r deployment_requirements.txt
    - name: Test with unittest
      run: |
        python -m unittest tests/test_demo.py